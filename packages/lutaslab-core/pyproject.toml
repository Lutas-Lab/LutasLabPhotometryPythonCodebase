[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lutaslab-core"
version = "0.1.0"
description = "Shared event, NI-DAQ, synchronization, and session primitives for Lutas Lab analyses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
events = ["pynapple>=0.11,<0.12"]
plotting = ["matplotlib>=3.8,<4"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
