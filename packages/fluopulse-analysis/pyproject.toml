[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluopulse-analysis"
version = "0.1.0"
description = "Doric FluoPulse lifetime photometry loading, waveform analysis, and NI-DAQ alignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "lutaslab-core>=0.1,<0.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
events = ["pynapple>=0.11,<0.12"]
dev = ["pytest>=8", "jupyterlab>=4", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
lutaslab-core = { workspace = true }
