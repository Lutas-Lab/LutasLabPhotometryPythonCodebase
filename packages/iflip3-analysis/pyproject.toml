[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iflip3-analysis"
version = "0.1.0"
description = "Safe loading and global analysis of iFLiP3 fluorescence-lifetime photometry data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lutaslab-core>=0.1,<0.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "jupyterlab>=4", "ipykernel>=6"]
events = ["pynapple>=0.11,<0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
lutaslab-core = { workspace = true }
