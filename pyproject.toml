[tool.pytest.ini_options]
testpaths = ["packages/lutaslab-photometry/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages/lutaslab-photometry/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
# NumPy 2.4's installed stubs use Python 3.12 type-statement syntax. Ruff and
# the 3.10/3.11 CI jobs separately enforce the package's base compatibility.
python_version = "3.12"
files = ["packages/lutaslab-core/src/lutaslab_core"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pynapple", "pynapple.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.uv]
required-version = ">=0.12.21,<0.13"
system-certs = true

[tool.uv.workspace]
members = [
    "packages/lutaslab-core",
    "packages/lutaslab-photometry",
    "packages/fluopulse-analysis",
    "packages/iflip3-analysis",
]
