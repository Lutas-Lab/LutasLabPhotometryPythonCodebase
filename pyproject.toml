[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lutaslab-photometry"
version = "0.1.0"
description = "Fiber photometry preprocessing, visualization, and behavioral modeling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lutaslab-core>=0.1,<0.2",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "pynapple>=0.11,<0.12",
]

[project.optional-dependencies]
forecasting = [
    "scikit-learn>=1.5,<2",
]
gui = [
    "pandas>=2,<3",
    "streamlit>=1.41,<2",
]
modeling = [
    "nemos>=0.2.9,<0.3",
    "jax>=0.4,<1",
]
nemos = [
    "nemos>=0.2.9,<0.3",
    "jax>=0.4,<1",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
required-version = ">=0.12.21,<0.13"

[tool.uv.workspace]
members = [
    "packages/lutaslab-core",
    "packages/fluopulse-analysis",
    "packages/iflip3-analysis",
]

[tool.uv.sources]
lutaslab-core = { workspace = true }
