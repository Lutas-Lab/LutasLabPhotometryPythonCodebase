name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,modeling]"
      - name: Compile source and notebooks
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src scripts tests
