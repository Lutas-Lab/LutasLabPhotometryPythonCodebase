name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install shared core
        run: python -m pip install -e "packages/lutaslab-core[events,plotting,dev]"
      - name: Test shared core
        run: >-
          python -m pytest
          --cov=lutaslab_core
          --cov-report=term-missing
          --cov-fail-under=80
          packages/lutaslab-core/tests
      - name: Lint shared core
        run: python -m ruff check packages/lutaslab-core/src packages/lutaslab-core/tests

  conventional-photometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked default analysis stack
        run: |
          python -m pip install "uv==0.12.21"
          uv sync --frozen --all-packages --extra dev --extra events --extra forecasting --extra gui --python 3.12
      - name: Compile source and notebooks
        run: >-
          .venv/bin/python -m compileall -q
          packages/lutaslab-photometry/src
          packages/lutaslab-photometry/tests
          packages/fluopulse-analysis/src
          packages/iflip3-analysis/src
      - name: Validate maintained notebooks
        run: .venv/bin/lutaslab-validate-notebooks
      - name: Run conventional-photometry tests
        run: >-
          .venv/bin/python -m pytest
          --cov=lutaslab_photometry
          --cov-report=term-missing
          --cov-fail-under=65
          packages/lutaslab-photometry/tests
      - name: Lint conventional-photometry code
        run: >-
          .venv/bin/ruff check
          conftest.py
          packages/lutaslab-photometry/src
          packages/lutaslab-photometry/tests
          streamlit_app.py
      - name: Type-check shared core public implementation
        run: .venv/bin/mypy

  fluopulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FluoPulse stack
        run: >-
          python -m pip install
          -e packages/lutaslab-core
          -e "packages/fluopulse-analysis[dev,events]"
      - name: Run FluoPulse tests
        run: >-
          python -m pytest
          --cov=fluopulse_analysis
          --cov-report=term-missing
          --cov-fail-under=78
          packages/fluopulse-analysis/tests
      - name: Lint FluoPulse code
        run: python -m ruff check packages/fluopulse-analysis/src packages/fluopulse-analysis/tests

  iflip3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install iFLiP3 stack
        run: >-
          python -m pip install
          -e packages/lutaslab-core
          -e "packages/iflip3-analysis[dev,events]"
      - name: Run iFLiP3 tests
        run: >-
          python -m pytest
          --cov=iflip3
          --cov-report=term-missing
          --cov-fail-under=75
          packages/iflip3-analysis/tests
      - name: Lint iFLiP3 code
        run: python -m ruff check packages/iflip3-analysis/src packages/iflip3-analysis/tests

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked GUI stack
        run: |
          python -m pip install "uv==0.12.21"
          uv sync --frozen --all-packages --extra dev --extra events --extra forecasting --extra gui --python 3.12
      - name: Check installation
        run: .venv\Scripts\lutaslab-check-install.exe
      - name: Test Windows-facing GUI workflows
        run: .venv\Scripts\python.exe -m pytest packages/lutaslab-photometry/tests/test_gui_workflows.py packages/lutaslab-photometry/tests/test_streamlit_app.py

  optional-nemos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked optional NeMoS backend
        run: |
          python -m pip install "uv==0.12.21"
          uv sync --frozen --package lutaslab-photometry --extra dev --extra nemos --python 3.12
      - name: Test NeMoS compatibility interface
        run: >-
          .venv/bin/python -m pytest
          --cov=lutaslab_photometry.nemos_analysis
          --cov-config=.coveragerc-nemos
          --cov-report=term-missing
          packages/lutaslab-photometry/tests/test_nemos_analysis.py
